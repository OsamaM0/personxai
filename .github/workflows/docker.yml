# Build the self-hosted image (docs/DOCKER.md) and publish it to GHCR.
#
# Runs on every push to main and on version tags; pull requests only build (no
# push) so the Dockerfile cannot rot unnoticed. Nothing to configure: GITHUB_TOKEN
# is enough to push to ghcr.io/<owner>/personxai.
name: Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - wrangler.docker.jsonc
      - package*.json
      - src/**
      - public/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
